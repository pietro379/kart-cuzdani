name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analiz ve testler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Statik analiz
        run: dart analyze

      - name: Testler
        run: flutter test
